<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230" width="100%" height="100%">
  <defs>
    <style>
      .neon-stroke {
        stroke: #38bdf8;
        stroke-width: 6.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
        filter: drop-shadow(0 0 4px #0ea5e9) drop-shadow(0 0 12px rgba(14, 165, 233, 0.75));
      }
      .neon-fill {
        fill: #38bdf8;
        filter: drop-shadow(0 0 4px #0ea5e9) drop-shadow(0 0 10px rgba(14, 165, 233, 0.8));
      }
    </style>
  </defs>

  <g transform="translate(15, 10)">
    <!-- Antena -->
    <line class="neon-stroke" x1="85" y1="36" x2="85" y2="18" />
    <circle class="neon-fill" cx="85" cy="14" r="8" />

    <!-- Orejas -->
    <rect class="neon-stroke" x="18" y="58" width="10" height="24" rx="5" />
    <rect class="neon-stroke" x="142" y="58" width="10" height="24" rx="5" />

    <!-- Cabeza -->
    <rect class="neon-stroke" x="28" y="36" width="114" height="68" rx="22" />

    <!-- Ojos -->
    <circle class="neon-stroke" cx="62" cy="70" r="10" stroke-width="5.5" />
    <circle class="neon-fill" cx="62" cy="70" r="4.5" />
    <circle class="neon-stroke" cx="108" cy="70" r="10" stroke-width="5.5" />
    <circle class="neon-fill" cx="108" cy="70" r="4.5" />

    <!-- Sonrisa -->
    <path class="neon-stroke" d="M 71 85 Q 85 96 99 85" stroke-width="5.5" />

    <!-- Cuerpo: Llaves de código { } -->
    <path class="neon-stroke" d="M 64 126 C 52 126, 46 135, 46 148 C 46 158, 44 163, 31 166 C 44 169, 46 174, 46 184 C 46 197, 52 206, 64 206" stroke-width="7" />
    <path class="neon-stroke" d="M 106 126 C 118 126, 124 135, 124 148 C 124 158, 126 163, 139 166 C 126 169, 124 174, 124 184 C 124 197, 118 206, 106 206" stroke-width="7" />
  </g>
</svg>
