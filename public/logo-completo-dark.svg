<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 88" fill="none" width="100%" height="100%">

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap');
      .texto-nombre {
        font-family: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 34px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .texto-rol {
        font-family: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 12px;
        font-weight: 700;
        fill: #94A3B8;
        letter-spacing: 0.16em;
      }
    </style>
  </defs>

  <!-- ==========================================
       1. ISOTIPO TECNOLÓGICO PB (GEAR & SYSTEMS)
       Margen izquierdo exacto = 16px
       ========================================== -->
  <g id="isotipo-pb" transform="translate(11, 5) scale(0.78)">
    <!-- Base: Engranaje exterior (Dientes) -->
    <circle cx="50" cy="50" r="38" stroke="#38BDF8" stroke-width="4.5" stroke-dasharray="14 16" stroke-linecap="round" opacity="0.65" />
    <!-- Base: Aro fino exterior punteado -->
    <circle cx="50" cy="50" r="44" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="3 6" />

    <!-- Monograma PB escalado al 88% con centro en (50, 50) -->
    <g id="monograma-pb" transform="translate(50 50) scale(0.88) translate(-50 -50)">
      <!-- Capa Inferior (Fondo): Letra B -->
      <g id="capa-b">
        <path d="M 36 30 H 52 C 59 30 63 34 63 41 C 63 48 59 51 52 51 H 36" stroke="#38BDF8" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M 46 51 H 55 C 62 51 66 55 66 62 C 66 69 62 72 55 72 H 36" stroke="#38BDF8" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>

      <!-- Capa Superior (Frente): Letra P con halo de recorte -->
      <g id="capa-p">
        <!-- Halo de corte para separación sobre la B -->
        <path d="M 36 26 V 74" stroke="#070B14" stroke-width="11" stroke-linecap="round" />
        <path d="M 36 29 H 52 C 60 29 65 34 65 41 C 65 48 60 52 52 52 H 36" stroke="#070B14" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />

        <!-- Trazo blanco puro en primer plano -->
        <path d="M 36 28 V 72" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />
        <path d="M 36 30 H 52 C 59 30 63 34 63 41 C 63 48 59 51 52 51 H 36" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>
  </g>

  <!-- ==========================================
       2. LOGOTIPO TIPOGRÁFICO Y ROL PROFESIONAL
       Margen derecho exacto = 16px
       ========================================== -->
  <g id="logotipo-texto">
    <!-- Línea 1: Pablo (Blanco) Bejas (Azul Tech) -->
    <text x="100" y="44" class="texto-nombre">
      <tspan fill="#FFFFFF">Pablo </tspan>
      <tspan fill="#3B82F6">Bejas</tspan>
    </text>
  </g>
</svg>
